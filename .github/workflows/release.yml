name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) when triggered manually'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Multi-OS Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Verify test suite before release
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Cross-compile CGO_ENABLED=0 release binaries
        run: |
          mkdir -p dist-release
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist-release/sen-windows-amd64.exe ./cmd/sen
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist-release/sen-windows-arm64.exe ./cmd/sen
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist-release/sen-darwin-arm64 ./cmd/sen
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist-release/sen-darwin-amd64 ./cmd/sen
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist-release/sen-linux-amd64 ./cmd/sen
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist-release/sen-linux-arm64 ./cmd/sen
          cd dist-release
          sha256sum sen-* > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: |
            dist-release/sen-windows-amd64.exe
            dist-release/sen-windows-arm64.exe
            dist-release/sen-darwin-arm64
            dist-release/sen-darwin-amd64
            dist-release/sen-linux-amd64
            dist-release/sen-linux-arm64
            dist-release/checksums.txt

